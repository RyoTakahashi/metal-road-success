# --- 見た目の進化（客層でS評価＝満足度80+ を取ると解禁）--------------------
# identity（ライオン耳/尻尾・金橙マネ髪＋ピンクメッシュ・琥珀眼）は不変の核。
# ここでは衣装・装飾・髪型アレンジ・オーラ「だけ」を盛る。核はメタルバンドのVo。
# 各ルックは実在のメタル・サブジャンルに寄せる（genre 参照）。
# key は src/ui/assets.ts の EVO_INFIX と一致させること（客層→ルック）:
#   goth=ビジュ / hard=コア / kawaii=ライト / death=玄人
# 出力名: {id}.v{version}.{evo}.{expression}.png（例 ryo.v2.goth.fired.png）
evolutions:
  goth:            # ビジュ層でS → 幽艶ゴシック（Evanescence系）
    label_ja: "幽艶ゴシック"
    segment: visual
    genre: "gothic / symphonic metal (Evanescence-inspired)"
    look:
      - "elegant black gothic corset gown with dark crimson underskirt and lace trim"
      - "long lace sleeves, black rose choker and a small ornate silver tiara"
      - "dramatic dark smoky eye makeup, pale complexion, mournful beautiful aura"
    aura: "moody violet-and-black stage haze with drifting dark rose petals and faint candlelight"
  hard:            # コア層でS → 鋼鉄ハードロック（正統派）
    label_ja: "鋼鉄ハードロック"
    segment: core
    genre: "classic heavy metal / hard rock (Judas Priest / Iron Maiden vibe)"
    look:
      - "open black leather biker jacket over a band tee, studded belt and bullet-belt"
      - "blue denim, silver-studded wristbands and fingerless gloves, chunky boots"
      - "confident planted power stance, roaring energy"
    aura: "warm amber stage-light glow with sparks and a hint of pyro flame"
  kawaii:          # ライト層でS → 紅黒カワメタ（BABYMETAL系）
    label_ja: "紅黒カワメタ"
    segment: light
    genre: "kawaii metal / idol metal (BABYMETAL-inspired), cute but heavy"
    look:
      - "black-and-red frilly gothic-idol stage dress, red tutu skirt over black lace"
      - "corset bodice with cross lacing, black-and-red striped arm warmers, red ribbons"
      - "playful fierce pose, energetic cute-yet-metal attitude"
    aura: "red-and-black sparkles with dark hearts, small stars and a burst of confetti"
  death:           # 玄人層でS → 戦鬼デスメタル（ウォー/デス）
    label_ja: "戦鬼デスメタル"
    segment: expert
    genre: "war metal / death metal, brutal and grim"
    look:
      - "black-and-white corpse-paint face makeup, fierce snarl"
      - "black battle armor with heavy spiked shoulder pauldrons, spiked gauntlets and bracers"
      - "bullet-belt, draped chains, tattered war garb, menacing stance"
    aura: "grim dark smoke with blood-red glow, jagged embers and an ominous backlight"

negatives:
  - "furry lion legs, animal paws, fur-covered body, animal lower body, full animal face, muzzle, masculine, adult tall body"
